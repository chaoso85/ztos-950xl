# ztOS-950XL rescue boot entries
set timeout=7
set pager=0
set default=0

menuentry "ztOS-950XL rescue SAFE-ChipIdea (HS USB core 0xf9a55000)" {
    devicetree /ztos/msm8994-msft-lumia-octagon-cityman-safe-ci.dtb
    linux /ztos/Image acpi=no console=tty0 earlycon=efifb ignore_loglevel loglevel=8 printk.time=1 log_buf_len=4M initcall_debug clk_ignore_unused pd_ignore_unused regulator_ignore_unused rdinit=/init
    initrd /ztos/rescue.cpio.gz
}

menuentry "ztOS-950XL rescue SAFE (DWC3)" {
    devicetree /ztos/msm8994-msft-lumia-octagon-cityman-safe.dtb
    linux /ztos/Image acpi=no console=tty0 earlycon=efifb ignore_loglevel loglevel=8 printk.time=1 log_buf_len=4M initcall_debug clk_ignore_unused pd_ignore_unused regulator_ignore_unused rdinit=/init
    initrd /ztos/rescue.cpio.gz
}

menuentry "Windows (eMMC)" {
    search --no-floppy --file --set=esp /EFI/Microsoft/Boot/bootmgfw_real.efi
    chainloader ($esp)/EFI/Microsoft/Boot/bootmgfw_real.efi
}

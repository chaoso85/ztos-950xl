# ztOS-950XL rescue boot entry (first on-device test)
set timeout=3
menuentry "ztOS-950XL rescue (USB gadget)" {
    devicetree /ztos/msm8994-msft-lumia-octagon-cityman.dtb
    linux /ztos/Image acpi=no console=tty0 earlycon=efifb ignore_loglevel loglevel=8 clk_ignore_unused pd_ignore_unused rdinit=/init
    initrd /ztos/rescue.cpio.gz
}

menuentry "Windows (eMMC)" {
    search --no-floppy --file --set=esp /EFI/Microsoft/Boot/bootmgfw_real.efi
    chainloader ($esp)/EFI/Microsoft/Boot/bootmgfw_real.efi
}

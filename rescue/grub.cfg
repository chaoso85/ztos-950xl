# ztOS-950XL rescue boot entries
# NOTE: never add keep_bootcon - it keeps the slow efifb boot console and makes the boot take 10-25 minutes.
set timeout=7
set pager=0
set default=0

menuentry "ztOS-950XL UEFI framebuffer screen (SAFE DT: display driver, GPU, camera, their SMMUs off) - reliable" {
    devicetree /ztos/msm8994-msft-lumia-octagon-cityman-safe.dtb
    linux /ztos/Image acpi=no console=tty0 earlycon=efifb ignore_loglevel loglevel=8 printk.time=1 log_buf_len=4M clk_ignore_unused pd_ignore_unused regulator_ignore_unused rdinit=/init
    initrd /ztos/rescue.cpio.gz
}

menuentry "ztOS-950XL FULL DT, msm DRM on (TEST: MDP SMMU bypass until DRM attach)" {
    devicetree /ztos/msm8994-msft-lumia-octagon-cityman.dtb
    linux /ztos/Image acpi=no console=tty0 earlycon=efifb ignore_loglevel loglevel=8 printk.time=1 log_buf_len=4M initcall_debug clk_ignore_unused pd_ignore_unused regulator_ignore_unused rdinit=/init
    initrd /ztos/rescue.cpio.gz
}

menuentry "Windows (eMMC)" {
    search --no-floppy --file --set=esp /EFI/Microsoft/Boot/bootmgfw_real.efi
    chainloader ($esp)/EFI/Microsoft/Boot/bootmgfw_real.efi
}

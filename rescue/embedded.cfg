# ztOS-950XL GRUB. SD card with /ztos/grub.cfg present -> Linux menu. Otherwise -> straight to Windows.
set timeout=5
search --no-floppy --file --set=ztosroot /ztos/grub.cfg
if [ -n "$ztosroot" ]; then
    set root=$ztosroot
    configfile /ztos/grub.cfg
fi
search --no-floppy --file --set=esp /EFI/Microsoft/Boot/bootmgfw_real.efi
if [ -n "$esp" ]; then
    chainloader ($esp)/EFI/Microsoft/Boot/bootmgfw_real.efi
    boot
fi
echo "ztOS: neither SD (/ztos/grub.cfg) nor Windows (bootmgfw_real.efi) found"
sleep 30
